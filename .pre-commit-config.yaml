# .pre-commit-config.yaml
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        exclude: files/kubectl-vsphere
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/hadolint/hadolint
    rev: v2.14.0
    hooks:
      - id: hadolint
        files: ^Dockerfile$
        # SC3059/SC3060 flag bash-only `${v^}` and `${v/a/b}` as non-POSIX.
        # Both stages declare `SHELL ["/bin/bash", ...]`, so bash is what
        # actually runs and the portability warnings are false positives.
        args: [ "--ignore=DL3018", "--ignore=SC2016", "--ignore=DL3008", "--ignore=SC2015", "--ignore=DL3059", "--ignore=SC3059", "--ignore=SC3060" ]

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
        files: \.sh$
        args: [ "--exclude=SC2086", "--exclude=SC2054", "--exclude=SC2034" ]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
