# .pre-commit-config.yaml
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        exclude: files/kubectl-vsphere
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      # hadolint-docker, not hadolint: the latter is a `language: system` hook
      # that needs the binary already on PATH, so it passes on a laptop with
      # `brew install hadolint` and fails on a clean runner with
      # "Executable `hadolint` not found".
      #
      # Note `rev` pins only the hook definition - the hook's entry is the
      # untagged `ghcr.io/hadolint/hadolint`, so the linter itself is whatever
      # :latest currently is. Hence the SC30xx ignores below, which a pinned
      # v2.14.0 would not need.
      - id: hadolint-docker
        files: ^Dockerfile$
        args: [ "--ignore=DL3018", "--ignore=SC2016", "--ignore=DL3008", "--ignore=SC2015", "--ignore=DL3059" ]

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
        files: \.sh$
        args: [ "--exclude=SC2086", "--exclude=SC2054", "--exclude=SC2034" ]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
